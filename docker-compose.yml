version: '3.8'

services:
  # ========================================================
  # BACKEND SERVICE (Express + TypeScript REST API)
  # ========================================================
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: luna-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=luna_handmade_galaxy_nebula_secret_key_2025
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - DATA_DIR=data
      - UPLOAD_DIR=uploads
      - BASE_URL=http://localhost:5000
      - ADMIN_GMAIL=admin.luna@gmail.com
      - ADMIN_PASSWORD=LunaCraft2025@
    volumes:
      # Persistent storage for JSON data files
      - ./BE/data:/app/data
      # Persistent storage for uploaded media files
      - ./BE/uploads:/app/uploads
    networks:
      - luna-network

  # ========================================================
  # FRONTEND SERVICE (React 19 + Vite + Nginx Reverse Proxy)
  # ========================================================
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: luna-frontend
    restart: unless-stopped
    ports:
      # Standard HTTP port
      - "80:80"
      # Additional port 3000 mapping for local testing convenience
      - "3000:80"
    depends_on:
      - backend
    networks:
      - luna-network

networks:
  luna-network:
    driver: bridge
